plugins { id 'com.android.application' }

def ksPath = System.getenv('META_MAPS_KEYSTORE')
android {
    namespace 'io.github.vedhrishi.metamaps'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.vedhrishi.metamaps'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                storePassword System.getenv('META_MAPS_KS_PASS')
                keyAlias 'metamaps'
                keyPassword System.getenv('META_MAPS_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPath) signingConfig signingConfigs.release
        }
    }
    dependencies {
        implementation 'androidx.core:core:1.13.1'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.robolectric:robolectric:4.14.1'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
